site_name: Algebra over Wire Formats
site_description: Pedagogical blog posts exploring information theory by construction in C++23
site_author: Alexander Towell
site_url: https://queelius.github.io/wire-formats/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - pymdownx.details
  - tables
  - footnotes
  - attr_list

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - About: about.md
  - "Foundations":
      - "Kraft's Inequality": "post/2020-03-kraft-wire-formats/index.md"
      - "McMillan's Converse": "post/2020-09-mcmillan-wire-formats/index.md"
  - "Universal Codes":
      - "Universal Codes as Priors": "post/2022-01-priors-wire-formats/index.md"
      - "Unary and Elias Gamma": "post/2022-06-elias-gamma-wire-formats/index.md"
      - "Elias Delta and Omega": "post/2022-11-elias-delta-omega-wire-formats/index.md"
      - "Fibonacci Coding": "post/2023-04-fibonacci-wire-formats/index.md"
      - "Rice / Golomb": "post/2023-09-rice-golomb-wire-formats/index.md"
      - "VByte / Varint": "post/2024-02-vbyte-wire-formats/index.md"
  - "Entropy-Optimal":
      - "Huffman Coding": "post/2024-08-huffman-wire-formats/index.md"
      - "Arithmetic Coding": "post/2025-01-arithmetic-coding-wire-formats/index.md"
